<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weather Lookup App</title>
  <style>
    body {
      font-family: 'Poppins', sans-serif;
      background: linear-gradient(-45deg, #8E9AA6, #F4F0EA, #5F6B5E, #2C3A47);
      background-size: 400% 400%;
      animation: gradientBG 15s ease infinite;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      text-align: center;
    }
    
    @keyframes gradientBG {
      0% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
      100% { background-position: 0% 50%; }
    }

    .snow-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none; 
      z-index: 9999; 
      overflow: hidden;
    }

    .snowflake {
      position: absolute;
      top: -10px;
      background: rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      pointer-events: none;
      animation: fall linear infinite, sway ease-in-out infinite;
    }

    @keyframes fall {
      to { transform: translateY(105vh); }
    }

    @keyframes sway {
      0%, 100% { margin-left: 0px; }
      50% { margin-left: 50px; }
    }

    h1 {
      font-size: 2rem;
      margin-bottom: 1rem;
    }

    .weather-container {
      background: rgba(255, 255, 255, 0.15);
      padding: 2rem;
      border-radius: 20px;
      box-shadow: 0 4px 10px rgba(0, 0, 0, 0.2);
      max-width: 400px;
      width: 90%;
      position: relative;
      z-index: 10; /* Ensures container stays interactable underneath snow layer */
    }

    input {
      padding: 0.5rem;
      border: none;
      border-radius: 8px;
      width: 70%;
      font-size: 1rem;
      outline: none;
      color: #333;
    }

    button {
      background-color: #2C3A47;
      color: white;
      border: none;
      border-radius: 8px;
      padding: 0.6rem 1rem;
      font-size: 1rem;
      cursor: pointer;
      transition: all 0.3s ease-in-out;
    }

    button:hover {
      background-color: #5F6B5E;
    }

    .result {
      margin-top: 1.5rem;
      font-size: 1.1rem;
    }

    .error {
      color: #ffeaa7;
      font-weight: bold;
    }

    .temp {
      font-size: 2.5rem;
      font-weight: bold;
      margin-top: 1rem;
    }

    footer {
      margin-top: 2rem;
      font-size: 0.8rem;
      color: #dfe6e9;
    }
  </style>
</head>
<body>

  <div class="snow-container" id="snowContainer"></div>

  <div class="weather-container">
    <h1>🌦️ Weather Lookup App</h1>
    <p>Enter any city to see its current weather.</p>
    <input type="text" id="cityInput" placeholder="Enter city name..." />
    <br><br>
    <button onclick="getWeather()">Get Weather</button>

    <div class="result" id="result"></div>
  </div>

  <footer>Powered by OpenWeatherMap API</footer>

  <script>
    // Existing weather function
    async function getWeather() {
      const city = document.getElementById("cityInput").value.trim();
      const resultDiv = document.getElementById("result");
      resultDiv.innerHTML = "";

      if (!city) {
        resultDiv.innerHTML = "<p class='error'>Please enter a city name.</p>";
        return;
      }

      resultDiv.innerHTML = "<p>Loading...</p>";

      const apiKey = "c086d0ddb0d7991ee1929050cb699643";
      const url = `https://api.openweathermap.org/data/2.5/weather?q=${city}&appid=${apiKey}&units=metric`;

      try {
        const response = await fetch(url);
        if (!response.ok) {
          throw new Error("City not found");
        }
        const data = await response.json();

        const temperature = data.main.temp;
        const description = data.weather[0].description;
        const icon = data.weather[0].icon;

        resultDiv.innerHTML = `
          <h2>${data.name}, ${data.sys.country}</h2>
          <img src="https://openweathermap.org/img/wn/${icon}@2x.png" alt="Weather Icon" />
          <p class="temp">${temperature}°C</p>
          <p>${description.charAt(0).toUpperCase() + description.slice(1)}</p>
        `;
      } catch (error) {
        resultDiv.innerHTML = "<p class='error'>City not found. Please try again.</p>";
      }
    }

    // 2. The Missing Snow Machine JavaScript Code
    function createSnow() {
      const container = document.getElementById("snowContainer");
      const numberOfFlakes = 50; 

      for (let i = 0; i < numberOfFlakes; i++) {
        const flake = document.createElement("div");
        flake.classList.add("snowflake");

        const size = Math.random() * 4 + 2;
        flake.style.width = `${size}px`;
        flake.style.height = `${size}px`;
        flake.style.left = `${Math.random() * 100}vw`;

        const fallDuration = Math.random() * 5 + 5;
        const swayDuration = Math.random() * 2 + 3;
        const delay = Math.random() * 5;

        flake.style.animationName = 'fall, sway';
        flake.style.animationDuration = `${fallDuration}s, ${swayDuration}s`;
        flake.style.animationDelay = `${delay}s, ${delay}s`;
        
        if (size > 4) {
          flake.style.filter = "blur(1px)";
        }

        container.appendChild(flake);
      }
    }

    // Starts the snow automatically when the window loads
    window.addEventListener("DOMContentLoaded", createSnow);
  </script>
</body>
</html>
